name: Android release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing tag to publish after verification (empty means artifacts only)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore release signing key
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGN_KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          umask 077
          printf '%s' "$SIGN_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          printf 'KEYSTORE_PATH=%s\nKEYSTORE_PASSWORD=%s\nKEY_ALIAS=%s\nKEY_PASSWORD=%s\n' \
            "$RUNNER_TEMP/release.jks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > local.properties
      - name: Test and build release
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --stacktrace
      - name: Verify APK signature and package
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/c001apk-comments-release.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs dist/c001apk-comments-release.apk | tee dist/signature.txt
          EXPECTED_CERT=$(keytool -exportcert -keystore "$RUNNER_TEMP/release.jks" -alias "$KEY_ALIAS" -storepass:env KEYSTORE_PASSWORD | sha256sum | cut -d' ' -f1)
          ACTUAL_CERT=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' dist/signature.txt)
          test "$EXPECTED_CERT" = "$ACTUAL_CERT"
          "$BUILD_TOOLS/aapt" dump badging dist/c001apk-comments-release.apk > dist/package.txt
          (cd dist && sha256sum c001apk-comments-release.apk > SHA256SUMS)
          head -1 dist/package.txt
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: app/build/reports/tests/
      - uses: actions/upload-artifact@v4
        with:
          name: release-mapping
          path: app/build/outputs/mapping/release/
      - name: Publish verified release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          gh release create "$RELEASE_TAG" dist/* --verify-tag \
            --title '修复新版酷安评论接口' --notes-file docs/comment-api-release.md
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" local.properties
