name: Reply scroll regression

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - '.github/workflows/reply-scroll-tests.yml'
      - 'app/src/androidTest/**'
      - 'app/src/debug/**'
      - 'app/src/main/java/com/example/c001apk/ui/feed/reply/**'
      - 'app/src/main/java/com/example/c001apk/view/SmoothInputLayout.kt'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 35]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build test APKs
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          # The GIF dependency only ships ARM libraries; Google images translate ARM.
          target: google_apis
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.example.c001apk.ui.feed.reply.ReplyScrollTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reply-scroll-test-results-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
